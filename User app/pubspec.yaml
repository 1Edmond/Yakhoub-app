  textfield_tags: ^2.0.2

  # Vendor app specific dependencies
  autocomplete_textfield: ^2.0.1
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  flutter_speed_dial: ^7.0.0
  barcode_widget: ^2.0.4
  barcode_scan2: ^4.7.2
  print_bluetooth_thermal: ^1.1.7
  screenshot: ^3.0.0
  esc_pos_utils: ^1.1.0
  animated_floating_buttons: ^0.0.2
  flutter_xlider: ^3.5.0
  typed_data: ^1.4.0
  collection: any

dependency_overrides:
  syncfusion_flutter_core: ^33.2.8

dev_dependencies:
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  icons_launcher:

  flutter_test:
    sdk: flutter

icons_launcher:
  image_path: "assets/images/ic_launcher.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true

flutter_icons:
  ios: true
  android: true
  image_path: "assets/images/ic_launcher.png"

flutter:
  uses-material-design: true
  config:
    disable-swift-package-manager: true

  assets:
    - assets/images/
    - assets/language/
    - assets/svg/

  fonts:
    - family: SF-Pro-Rounded-Regular
      fonts:
        - asset: assets/fonts/ubuntu/SF-Pro-Rounded-Regular.ttf
          weight: 400
        - asset: assets/fonts/ubuntu/SF-Pro-Rounded-Regular.ttf
          weight: 500
        - asset: assets/fonts/ubuntu/SF-Pro-Rounded-Regular.ttf
          weight: 600
    - family: Roboto
      fonts:
        - asset: assets/font/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/roboto/Roboto-Bold.ttf
          weight: 700